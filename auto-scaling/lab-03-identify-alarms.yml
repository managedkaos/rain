  AlarmEffectivenessDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub alarm-effectiveness-${AWS::StackName}
      DashboardBody: !Sub |
        {
          "start": "-PT3H",
          "periodOverride": "inherit",
          "widgets": [
            { "type": "text", "x": 0, "y": 0, "width": 24, "height": 2, "properties": { "markdown": "# Alarm effectiveness analysis\nCompare scaling controls, operator notifications, workload behavior, and customer impact over the same time range." } },
            { "type": "metric", "x": 0, "y": 2, "width": 6, "height": 6, "properties": { "title": "Request Scale-Out Control", "annotations": { "alarms": [ "${RequestHighAlarm.Arn}" ] }, "view": "timeSeries", "stacked": false } },
            { "type": "metric", "x": 6, "y": 2, "width": 6, "height": 6, "properties": { "title": "Request Scale-In Control", "annotations": { "alarms": [ "${RequestLowAlarm.Arn}" ] }, "view": "timeSeries", "stacked": false } },
            { "type": "metric", "x": 12, "y": 2, "width": 6, "height": 6, "properties": { "title": "CPU High (No Scaling Action, Operator Alert)", "annotations": { "alarms": [ "${CpuHighAlarm.Arn}" ] }, "view": "timeSeries", "stacked": false } },
            { "type": "metric", "x": 18, "y": 2, "width": 6, "height": 6, "properties": { "title": "CPU Low (No Scaling Action)", "annotations": { "alarms": [ "${CpuLowAlarm.Arn}" ] }, "view": "timeSeries", "stacked": false } },
            { "type": "metric", "x": 0, "y": 8, "width": 8, "height": 6, "properties": { "title": "Operator High Request (Duplicate)", "annotations": { "alarms": [ "${OperatorHighRequestAlarm.Arn}" ] }, "view": "timeSeries", "stacked": false } },
            { "type": "metric", "x": 8, "y": 8, "width": 8, "height": 6, "properties": { "title": "Operator Any Target 5xx", "annotations": { "alarms": [ "${OperatorAnyTarget5xxAlarm.Arn}" ] }, "view": "timeSeries", "stacked": false } },
            { "type": "metric", "x": 16, "y": 8, "width": 8, "height": 6, "properties": { "title": "Operator Sustained Error Rate", "annotations": { "alarms": [ "${OperatorSustainedErrorRateAlarm.Arn}" ] }, "view": "timeSeries", "stacked": false } },
            {
              "type": "log",
              "x": 0,
              "y": 14,
              "width": 24,
              "height": 7,
              "properties": {
                "region": "${AWS::Region}",
                "title": "Operator Alert Event Log",
                "view": "table",
                "query": "SOURCE '${AlertLogGroup}' | fields @timestamp, alarmName, newState, alarmDescription, reason | filter ispresent(alarmName) | sort @timestamp desc | limit 100"
              }
            },
            {
              "type": "metric",
              "x": 0,
              "y": 21,
              "width": 24,
              "height": 6,
              "properties": {
                "metrics": [
                  [ "AWS/AutoScaling", "GroupDesiredCapacity", "AutoScalingGroupName", "${AutoScalingGroup}", { "stat": "Average", "period": 60, "label": "ASG Desired Capacity", "yAxis": "left" } ],
                  [ "AWS/AutoScaling", "GroupInServiceInstances", "AutoScalingGroupName", "${AutoScalingGroup}", { "stat": "Average", "period": 60, "label": "ASG In-Service Instances", "yAxis": "left" } ],
                  [ "AWS/ApplicationELB", "RequestCountPerTarget", "TargetGroup", "${ApplicationTargetGroup.TargetGroupFullName}", { "stat": "Sum", "period": 60, "label": "Requests Per Target", "yAxis": "right" } ]
                ],
                "view": "timeSeries",
                "stacked": false,
                "region": "${AWS::Region}",
                "title": "Request Demand and Capacity",
                "period": 60,
                "yAxis": { "left": { "min": 0 }, "right": { "min": 0 } },
                "annotations": {
                  "horizontal": [
                    { "value": ${RequestScaleOutThreshold}, "label": "Scale out 1000", "color": "#d62728" },
                    { "value": ${RequestScaleInThreshold}, "label": "Scale in 500", "color": "#2ca02c" }
                  ]
                }
              }
            },
            {
              "type": "metric",
              "x": 0,
              "y": 27,
              "width": 12,
              "height": 6,
              "properties": {
                "metrics": [
                  [ "AWS/EC2", "CPUUtilization", "AutoScalingGroupName", "${AutoScalingGroup}", { "stat": "Average", "period": 60, "label": "ASG Average CPU" } ]
                ],
                "view": "timeSeries",
                "stacked": false,
                "region": "${AWS::Region}",
                "title": "CPU Activity and Capacity",
                "period": 60,
                "yAxis": { "left": { "min": 0, "max": 100 } }
              }
            },
            {
              "type": "metric",
              "x": 12,
              "y": 27,
              "width": 12,
              "height": 6,
              "properties": {
                "metrics": [
                  [ "AWS/ApplicationELB", "TargetResponseTime", "LoadBalancer", "${ApplicationLoadBalancer.LoadBalancerFullName}", "TargetGroup", "${ApplicationTargetGroup.TargetGroupFullName}", { "stat": "p95", "period": 60, "label": "p95 Target Response Time", "yAxis": "left" } ],
                  [ ".", "HealthyHostCount", ".", ".", ".", ".", { "stat": "Average", "period": 60, "label": "Healthy Hosts", "yAxis": "right" } ]
                ],
                "view": "timeSeries",
                "stacked": false,
                "region": "${AWS::Region}",
                "title": "Application Health",
                "period": 60,
                "yAxis": { "left": { "min": 0 }, "right": { "min": 0 } }
              }
            },
            {
              "type": "metric",
              "x": 0,
              "y": 33,
              "width": 24,
              "height": 6,
              "properties": {
                "metrics": [
                  [ { "expression": "IF(requests > 0, errors * 100 / requests, 0)", "label": "Target 5xx Error Rate %", "id": "error_rate", "yAxis": "left" } ],
                  [ "AWS/ApplicationELB", "HTTPCode_Target_5XX_Count", "LoadBalancer", "${ApplicationLoadBalancer.LoadBalancerFullName}", "TargetGroup", "${ApplicationTargetGroup.TargetGroupFullName}", { "stat": "Sum", "period": 60, "label": "Target 5xx Count", "id": "errors", "visible": false } ],
                  [ "AWS/ApplicationELB", "RequestCount", "LoadBalancer", "${ApplicationLoadBalancer.LoadBalancerFullName}", { "stat": "Sum", "period": 60, "label": "Total Requests", "id": "requests", "visible": false } ]
                ],
                "view": "timeSeries",
                "stacked": false,
                "region": "${AWS::Region}",
                "title": "Customer-Facing Target Error Rate",
                "period": 60,
                "yAxis": { "left": { "min": 0, "max": 100 } },
                "annotations": {
                  "horizontal": [
                    { "value": ${SustainedErrorRateThreshold}, "label": "Sustained error threshold", "color": "#d62728" }
                  ]
                }
              }
            }
          ]
        }

  StackResourceGroup:
    Type: AWS::ResourceGroups::Group
    Properties:
      Name: !Sub rg-${AWS::StackName}
      Description: !Sub Resource group for CloudFormation stack ${AWS::StackName}
      ResourceQuery:
        Type: CLOUDFORMATION_STACK_1_0
        Query:
          ResourceTypeFilters:
            - AWS::AllSupported
          StackIdentifier: !Ref AWS::StackId
      Tags:
        - Key: ResourceGroup
          Value: !Sub rg-${AWS::StackName}

Outputs:
  AlbURL:
    Description: Application Load Balancer URL
    Value: !Sub http://${ApplicationLoadBalancer.DNSName}/

  AutoScalingGroupName:
    Description: Auto Scaling Group name
    Value: !Ref AutoScalingGroup

  ApplicationLoadBalancerFullName:
    Description: CloudWatch LoadBalancer dimension for the Application Load Balancer
    Value: !GetAtt ApplicationLoadBalancer.LoadBalancerFullName

  ApplicationTargetGroupFullName:
    Description: CloudWatch TargetGroup dimension for the Application Load Balancer target group
    Value: !GetAtt ApplicationTargetGroup.TargetGroupFullName

  CpuPerformanceDashboardName:
    Description: CloudWatch dashboard for ASG/EC2 CPU performance
    Value: !Ref CpuPerformanceDashboard

  AlbPerformanceDashboardName:
    Description: CloudWatch dashboard for ASG/ALB request performance
    Value: !Ref AlbPerformanceDashboard

  AlarmEffectivenessDashboardName:
    Description: Primary CloudWatch dashboard for Lab 03 alarm-effectiveness analysis
    Value: !Ref AlarmEffectivenessDashboard

  AlertLogGroupName:
    Description: CloudWatch Logs group containing internal operator alarm notifications
    Value: !Ref AlertLogGroup

  OperatorAlertTopicArn:
    Description: Internal SNS topic receiving operator alarm and recovery actions
    Value: !Ref OperatorAlertTopic

  RequestScaleOutPolicyArn:
    Description: Enabled request-based scale-out policy ARN
    Value: !Ref RequestStepScaleOutPolicy

  RequestScaleInPolicyArn:
    Description: Enabled request-based scale-in policy ARN
    Value: !Ref RequestStepScaleInPolicy

  LoadGeneratorInstanceId:
    Description: Instance ID of the Apache Bench load generator instance
    Value: !Ref LoadGeneratorInstance

  LoadGeneratorSsmCommand:
    Description: AWS CLI SSM command to connect to the LoadGeneratorInstance as root
    Value: !Sub |
      aws ssm start-session --target ${LoadGeneratorInstance}
