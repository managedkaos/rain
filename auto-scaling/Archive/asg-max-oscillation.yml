---
AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Auto Scaling oscillation demo with an ALB, EC2 Auto Scaling Group, and a load generator.
  The application exposes a long-lived Server-Sent Events endpoint that keeps connections pinned
  to existing instances, while request-driven CPU work increases utilization. This demonstrates how
  architecture can make ASG average CPU a weak scaling signal even when the scaling policy itself is reasonable.

Parameters:
  AsgMinSize:
    Type: Number
    Default: 1
    MinValue: 1
    Description: Minimum number of EC2 instances in the Auto Scaling group; also the initial desired capacity on create.

  AsgMaxSize:
    Type: Number
    Default: 6
    MinValue: 1
    Description: Maximum number of EC2 instances in the Auto Scaling group.

  InstanceType:
    Type: String
    Default: t3.small
    AllowedValues:
      - t3.small
      - t3.medium
      - t3.large
    Description: Instance type for the Auto Scaling group and load generator.

  CpuScaleOutThreshold:
    Type: Number
    Default: 50
    MinValue: 1
    MaxValue: 100
    Description: Average ASG CPU percent above which scale-out alarm fires.

  CpuScaleInThreshold:
    Type: Number
    Default: 42
    MinValue: 1
    MaxValue: 100
    Description: Average ASG CPU percent below which scale-in alarm fires.

  CpuScalingPeriod:
    Type: Number
    Default: 60
    MinValue: 60
    MaxValue: 300
    Description: CloudWatch period in seconds for CPU alarms.

  CpuScaleOutEvaluationPeriods:
    Type: Number
    Default: 1
    MinValue: 1
    MaxValue: 10
    Description: Consecutive breaching periods before scale-out alarm triggers.

  CpuScaleInEvaluationPeriods:
    Type: Number
    Default: 2
    MinValue: 1
    MaxValue: 10
    Description: Consecutive breaching periods before scale-in alarm triggers.

  CpuStepScalingCooldown:
    Type: Number
    Default: 90
    MinValue: 0
    MaxValue: 900
    Description: Cooldown in seconds for step scaling policies.

  HealthCheckGracePeriod:
    Type: Number
    Default: 120
    MinValue: 0
    Description: Grace period in seconds before ELB health checks affect new instances.

  DefaultInstanceWarmup:
    Type: Number
    Default: 120
    MinValue: 0
    Description: Default instance warmup in seconds for scaling metrics.

  StreamHoldSeconds:
    Type: Number
    Default: 240
    MinValue: 30
    MaxValue: 900
    Description: How long the /stream endpoint keeps a connection open.

  WorkCpuMs:
    Type: Number
    Default: 250
    MinValue: 10
    MaxValue: 5000
    Description: Approximate CPU work in milliseconds performed for each /work request.

  KeepaliveClients:
    Type: Number
    Default: 40
    MinValue: 1
    MaxValue: 500
    Description: Number of concurrent long-lived stream clients started on the load generator.

  WorkClients:
    Type: Number
    Default: 16
    MinValue: 1
    MaxValue: 500
    Description: Number of concurrent short-request workers started on the load generator.

  WorkSleepMs:
    Type: Number
    Default: 150
    MinValue: 0
    MaxValue: 5000
    Description: Delay between /work requests per worker on the load generator.

  EnableBuiltInLoad:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: When true, start built-in /stream and /work load on the load generator. Set false for make request-spike.

  IndexCpuMs:
    Type: Number
    Default: 250
    MinValue: 0
    MaxValue: 5000
    Description: CPU work in milliseconds for each / request when EnableBuiltInLoad is false.

  KeyName:
    Type: String
    Default: ''
    Description: Optional EC2 key pair for SSH access to the load generator.

Conditions:
  HasKeyName: !Not [!Equals [!Ref KeyName, '']]

Resources:
  Role:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      Path: /
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
        - arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy
      Tags:
        - Key: ResourceGroup
          Value: !Sub ${AWS::StackName}-rg

  Profile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Path: /
      Roles:
        - !Ref Role

  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-vpc
        - Key: ResourceGroup
          Value: !Sub ${AWS::StackName}-rg

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-igw
        - Key: ResourceGroup
          Value: !Sub ${AWS::StackName}-rg

  VpcGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: 10.0.0.0/24
      MapPublicIpOnLaunch: true
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-public-a
        - Key: ResourceGroup
          Value: !Sub ${AWS::StackName}-rg

  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone: !Select [1, !GetAZs '']
      CidrBlock: 10.0.1.0/24
      MapPublicIpOnLaunch: true
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-public-b
        - Key: ResourceGroup
          Value: !Sub ${AWS::StackName}-rg

  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: 10.0.10.0/24
      MapPublicIpOnLaunch: false
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-private-a
        - Key: ResourceGroup
          Value: !Sub ${AWS::StackName}-rg

  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone: !Select [1, !GetAZs '']
      CidrBlock: 10.0.11.0/24
      MapPublicIpOnLaunch: false
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-private-b
        - Key: ResourceGroup
          Value: !Sub ${AWS::StackName}-rg

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-public-rt
        - Key: ResourceGroup
          Value: !Sub ${AWS::StackName}-rg

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: VpcGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnetA

  PublicSubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnetB

  EipA:
    Type: AWS::EC2::EIP
    DependsOn: VpcGatewayAttachment
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-nat-a-eip
        - Key: ResourceGroup
          Value: !Sub ${AWS::StackName}-rg

  NatGatewayA:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt EipA.AllocationId
      SubnetId: !Ref PublicSubnetA
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-nat-a
        - Key: ResourceGroup
          Value: !Sub ${AWS::StackName}-rg

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-private-rt
        - Key: ResourceGroup
          Value: !Sub ${AWS::StackName}-rg

  PrivateDefaultRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGatewayA

  PrivateSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      SubnetId: !Ref PrivateSubnetA

  PrivateSubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      SubnetId: !Ref PrivateSubnetB

  LoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow HTTP from the internet to the ALB
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: ResourceGroup
          Value: !Sub ${AWS::StackName}-rg

  InstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow HTTP from the ALB to the ASG instances
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourceSecurityGroupId: !Ref LoadBalancerSecurityGroup
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: ResourceGroup
          Value: !Sub ${AWS::StackName}-rg

  LoadGeneratorSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow outbound internet and optional SSH to the load generator
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - !If
          - HasKeyName
          - IpProtocol: tcp
            FromPort: 22
            ToPort: 22
            CidrIp: 0.0.0.0/0
          - !Ref AWS::NoValue
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: ResourceGroup
          Value: !Sub ${AWS::StackName}-rg

  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internet-facing
      Type: application
      SecurityGroups:
        - !Ref LoadBalancerSecurityGroup
      Subnets:
        - !Ref PublicSubnetA
        - !Ref PublicSubnetB
      Tags:
        - Key: asg-loadbalancer
          Value: true
        - Key: role
          Value: loadbalancer
        - Key: ResourceGroup
          Value: !Sub ${AWS::StackName}-rg

  ApplicationTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref Vpc
      Port: 80
      Protocol: HTTP
      TargetType: instance
      HealthCheckEnabled: true
      HealthCheckPath: /health
      HealthCheckProtocol: HTTP
      Matcher:
        HttpCode: '200'
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: '30'
      Tags:
        - Key: ResourceGroup
          Value: !Sub ${AWS::StackName}-rg

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref ApplicationTargetGroup

  LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      TagSpecifications:
        - ResourceType: launch-template
          Tags:
            - Key: ResourceGroup
              Value: !Sub ${AWS::StackName}-rg
      LaunchTemplateData:
        ImageId: '{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-6.1-x86_64}}'
        InstanceType: !Ref InstanceType
        IamInstanceProfile:
          Name: !Ref Profile
        Monitoring:
          Enabled: true
        MetadataOptions:
          HttpTokens: required
        NetworkInterfaces:
          - AssociatePublicIpAddress: false
            DeviceIndex: 0
            Groups:
              - !Ref InstanceSecurityGroup
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - Key: Name
                Value: !Sub ${AWS::StackName}-asg-webserver
              - Key: asg-webserver
                Value: true
              - Key: role
                Value: webserver
              - Key: ResourceGroup
                Value: !Sub ${AWS::StackName}-rg
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash -xe
            exec > >(tee /var/log/user-data.log) 2>&1

            dnf install -y python3 python3-pip nginx amazon-cloudwatch-agent

            mkdir -p /opt/aws/amazon-cloudwatch-agent/etc
            cat > /opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json <<'CWAGENT'
            {
              "metrics": {
                "metrics_collected": {
                  "cpu": {
                    "measurement": ["cpu_usage_idle", "cpu_usage_user", "cpu_usage_system"],
                    "metrics_collection_interval": 60,
                    "totalcpu": true
                  },
                  "mem": {
                    "measurement": ["mem_used_percent"],
                    "metrics_collection_interval": 60
                  }
                }
              }
            }
            CWAGENT

            systemctl enable amazon-cloudwatch-agent
            systemctl start amazon-cloudwatch-agent
            systemctl enable amazon-ssm-agent
            systemctl start amazon-ssm-agent

            python3 -m pip install --upgrade pip
            python3 -m pip install aiohttp gunicorn

            token=$(curl -sS -X PUT "http://169.254.169.254/latest/api/token" -H "X-aws-ec2-metadata-token-ttl-seconds: 21600")
            instance_id=$(curl -sS -H "X-aws-ec2-metadata-token: $token" http://169.254.169.254/latest/meta-data/instance-id)
            availability_zone=$(curl -sS -H "X-aws-ec2-metadata-token: $token" http://169.254.169.254/latest/meta-data/placement/availability-zone)

            mkdir -p /opt/sse-demo

            cat > /opt/sse-demo/app.py <<'PYAPP'
            import asyncio
            import json
            import math
            import os
            import socket
            import time
            from aiohttp import web

            INSTANCE_ID = os.environ.get("INSTANCE_ID", "unknown")
            AVAILABILITY_ZONE = os.environ.get("AVAILABILITY_ZONE", "unknown")
            STACK_NAME = os.environ.get("STACK_NAME", "unknown")
            STREAM_HOLD_SECONDS = int(os.environ.get("STREAM_HOLD_SECONDS", "240"))
            WORK_CPU_MS = int(os.environ.get("WORK_CPU_MS", "250"))
            INDEX_CPU_MS = int(os.environ.get("INDEX_CPU_MS", "0"))

            active_streams = 0
            total_streams = 0
            total_work = 0
            app_started = time.time()

            def cpu_burn(milliseconds: int) -> int:
                end = time.perf_counter() + (milliseconds / 1000.0)
                x = 0.0001
                loops = 0
                while time.perf_counter() < end:
                    x = math.sin(x + 0.1) * math.cos(x + 0.2) + math.sqrt(abs(x) + 1.0)
                    loops += 1
                return loops

            async def index(request: web.Request) -> web.Response:
                index_loops = cpu_burn(INDEX_CPU_MS) if INDEX_CPU_MS > 0 else 0
                payload = {
                    "instance_id": INSTANCE_ID,
                    "availability_zone": AVAILABILITY_ZONE,
                    "stack_name": STACK_NAME,
                    "hostname": socket.gethostname(),
                    "uptime_seconds": int(time.time() - app_started),
                    "active_streams": active_streams,
                    "total_streams": total_streams,
                    "total_work_requests": total_work,
                    "index_cpu_burn_ms": INDEX_CPU_MS,
                    "index_loops": index_loops,
                    "endpoints": {
                        "/": "instance details and counters",
                        "/health": "target group health check",
                        "/work": "CPU-heavy short request",
                        "/stream": "long-lived SSE connection"
                    }
                }
                return web.json_response(payload)

            async def health(request: web.Request) -> web.Response:
                return web.Response(text="ok\n", content_type="text/plain")

            async def work(request: web.Request) -> web.Response:
                global total_work
                loops = cpu_burn(WORK_CPU_MS)
                total_work += 1
                payload = {
                    "instance_id": INSTANCE_ID,
                    "availability_zone": AVAILABILITY_ZONE,
                    "cpu_burn_ms": WORK_CPU_MS,
                    "loops": loops,
                    "active_streams": active_streams,
                    "total_work_requests": total_work,
                    "timestamp": int(time.time())
                }
                return web.json_response(payload)

            async def stream(request: web.Request) -> web.StreamResponse:
                global active_streams, total_streams
                total_streams += 1
                active_streams += 1

                response = web.StreamResponse(
                    status=200,
                    reason='OK',
                    headers={
                        'Content-Type': 'text/event-stream',
                        'Cache-Control': 'no-cache',
                        'Connection': 'keep-alive'
                    }
                )
                await response.prepare(request)

                try:
                    start = time.time()
                    sequence = 0
                    while time.time() - start < STREAM_HOLD_SECONDS:
                        cpu_burn(25)
                        data = {
                            "event": "tick",
                            "instance_id": INSTANCE_ID,
                            "availability_zone": AVAILABILITY_ZONE,
                            "sequence": sequence,
                            "active_streams": active_streams,
                            "elapsed_seconds": int(time.time() - start)
                        }
                        await response.write(f"event: tick\ndata: {json.dumps(data)}\n\n".encode("utf-8"))
                        sequence += 1
                        await asyncio.sleep(1)
                except (ConnectionResetError, asyncio.CancelledError, BrokenPipeError):
                    pass
                finally:
                    active_streams -= 1
                    try:
                        await response.write_eof()
                    except Exception:
                        pass

                return response

            app = web.Application()
            app.add_routes([
                web.get('/', index),
                web.get('/health', health),
                web.get('/work', work),
                web.get('/stream', stream),
            ])

            if __name__ == '__main__':
                web.run_app(app, host='127.0.0.1', port=8080)
            PYAPP

            rm -f /etc/nginx/conf.d/default.conf
            nginx -t

            if [[ '${EnableBuiltInLoad}' == 'true' ]]; then
              INDEX_CPU_MS=0
            else
              INDEX_CPU_MS=${IndexCpuMs}
            fi

            cat > /etc/systemd/system/sse-demo.service <<SVC
            [Unit]
            Description=SSE hold demo web application
            After=network.target

            [Service]
            Environment=INSTANCE_ID=$instance_id
            Environment=AVAILABILITY_ZONE=$availability_zone
            Environment=STACK_NAME=${AWS::StackName}
            Environment=STREAM_HOLD_SECONDS=${StreamHoldSeconds}
            Environment=WORK_CPU_MS=${WorkCpuMs}
            Environment=INDEX_CPU_MS=$INDEX_CPU_MS
            WorkingDirectory=/opt/sse-demo
            ExecStart=/usr/local/bin/gunicorn --workers 1 --worker-class aiohttp.GunicornWebWorker --bind 127.0.0.1:8080 app:app
            Restart=always
            RestartSec=3

            [Install]
            WantedBy=multi-user.target
            SVC

            cat > /etc/nginx/conf.d/sse-demo.conf <<'NGINX'
            server {
              listen 80 default_server;
              server_name _;

              access_log /var/log/nginx/access.log;
              error_log /var/log/nginx/error.log;

              location / {
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_set_header Connection "";
                proxy_pass http://127.0.0.1:8080;
              }

              location /stream {
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_set_header Connection "";
                proxy_buffering off;
                proxy_cache off;
                proxy_read_timeout 900s;
                chunked_transfer_encoding off;
                proxy_pass http://127.0.0.1:8080/stream;
              }
            }
            NGINX

            rm -f /etc/nginx/conf.d/default.conf
            nginx -t
            systemctl daemon-reload
            systemctl enable --now sse-demo.service
            systemctl enable --now nginx

  AutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      AutoScalingGroupName: !Sub ${AWS::StackName}-asg
      MinSize: !Ref AsgMinSize
      MaxSize: !Ref AsgMaxSize
      DefaultInstanceWarmup: !Ref DefaultInstanceWarmup
      HealthCheckType: ELB
      HealthCheckGracePeriod: !Ref HealthCheckGracePeriod
      VPCZoneIdentifier:
        - !Ref PrivateSubnetA
        - !Ref PrivateSubnetB
      TargetGroupARNs:
        - !Ref ApplicationTargetGroup
      LaunchTemplate:
        LaunchTemplateId: !Ref LaunchTemplate
        Version: !GetAtt LaunchTemplate.LatestVersionNumber
      MetricsCollection:
        - Granularity: '1Minute'
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-asg-webserver
          PropagateAtLaunch: true
        - Key: asg-webserver
          Value: true
          PropagateAtLaunch: true
        - Key: role
          Value: webserver
          PropagateAtLaunch: true
        - Key: ResourceGroup
          Value: !Sub ${AWS::StackName}-rg
          PropagateAtLaunch: true

  ScaleOutPolicy:
    Type: AWS::AutoScaling::ScalingPolicy
    Properties:
      AutoScalingGroupName: !Ref AutoScalingGroup
      PolicyType: StepScaling
      AdjustmentType: ChangeInCapacity
      Cooldown: !Ref CpuStepScalingCooldown
      MetricAggregationType: Average
      EstimatedInstanceWarmup: !Ref DefaultInstanceWarmup
      StepAdjustments:
        - MetricIntervalLowerBound: 0
          ScalingAdjustment: 1

  ScaleInPolicy:
    Type: AWS::AutoScaling::ScalingPolicy
    Properties:
      AutoScalingGroupName: !Ref AutoScalingGroup
      PolicyType: StepScaling
      AdjustmentType: ChangeInCapacity
      Cooldown: !Ref CpuStepScalingCooldown
      MetricAggregationType: Average
      EstimatedInstanceWarmup: !Ref DefaultInstanceWarmup
      StepAdjustments:
        - MetricIntervalUpperBound: 0
          ScalingAdjustment: -1

  CpuScaleOutAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: !Sub Average ASG CPU above ${CpuScaleOutThreshold}% triggers scale out.
      Namespace: AWS/EC2
      MetricName: CPUUtilization
      Statistic: Average
      Period: !Ref CpuScalingPeriod
      EvaluationPeriods: !Ref CpuScaleOutEvaluationPeriods
      Threshold: !Ref CpuScaleOutThreshold
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref ScaleOutPolicy
      Dimensions:
        - Name: AutoScalingGroupName
          Value: !Ref AutoScalingGroup

  CpuScaleInAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: !Sub Average ASG CPU below ${CpuScaleInThreshold}% triggers scale in.
      Namespace: AWS/EC2
      MetricName: CPUUtilization
      Statistic: Average
      Period: !Ref CpuScalingPeriod
      EvaluationPeriods: !Ref CpuScaleInEvaluationPeriods
      Threshold: !Ref CpuScaleInThreshold
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions:
        - !Ref ScaleInPolicy
      Dimensions:
        - Name: AutoScalingGroupName
          Value: !Ref AutoScalingGroup

  LoadGeneratorInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: '{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-6.1-x86_64}}'
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref Profile
      KeyName: !If [HasKeyName, !Ref KeyName, !Ref AWS::NoValue]
      SubnetId: !Ref PublicSubnetA
      SecurityGroupIds:
        - !Ref LoadGeneratorSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-loadgen
        - Key: asg-load-generator
          Value: true
        - Key: role
          Value: load-generator
        - Key: ResourceGroup
          Value: !Sub ${AWS::StackName}-rg
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash -xe
          exec > >(tee /var/log/user-data.log) 2>&1

          dnf install -y python3 python3-pip jq httpd-tools
          python3 -m pip install --upgrade pip
          python3 -m pip install aiohttp

          cat > /opt/loadgen.py <<'PYLOAD'
          import asyncio
          import random
          import aiohttp
          import os

          ALB_DNS = os.environ["ALB_DNS"]
          STREAM_CLIENTS = int(os.environ["STREAM_CLIENTS"])
          WORK_CLIENTS = int(os.environ["WORK_CLIENTS"])
          WORK_SLEEP_MS = int(os.environ["WORK_SLEEP_MS"])

          async def stream_worker(session, worker_id):
              url = f"http://{ALB_DNS}/stream"
              while True:
                  try:
                      async with session.get(url, timeout=aiohttp.ClientTimeout(total=None)) as resp:
                          async for _ in resp.content:
                              pass
                  except Exception:
                      await asyncio.sleep(2)

          async def work_worker(session, worker_id):
              url = f"http://{ALB_DNS}/work"
              pause = WORK_SLEEP_MS / 1000.0
              while True:
                  try:
                      async with session.get(url, timeout=aiohttp.ClientTimeout(total=120)) as resp:
                          await resp.text()
                  except Exception:
                      await asyncio.sleep(1)
                  await asyncio.sleep(pause + random.uniform(0, pause / 3 if pause else 0.01))

          async def main():
              connector = aiohttp.TCPConnector(limit=0, force_close=False)
              async with aiohttp.ClientSession(connector=connector) as session:
                  tasks = []
                  for i in range(STREAM_CLIENTS):
                      tasks.append(asyncio.create_task(stream_worker(session, i)))
                  for i in range(WORK_CLIENTS):
                      tasks.append(asyncio.create_task(work_worker(session, i)))
                  await asyncio.gather(*tasks)

          asyncio.run(main())
          PYLOAD

          cat > /usr/local/bin/demo-status <<STATUS
          #!/bin/bash
          curl -s http://${ApplicationLoadBalancer.DNSName}/ | jq .
          STATUS
          chmod +x /usr/local/bin/demo-status

          cat > /etc/systemd/system/loadgen.service <<SVC
          [Unit]
          Description=Long-lived connection load generator
          After=network-online.target
          Wants=network-online.target

          [Service]
          Environment=ALB_DNS=${ApplicationLoadBalancer.DNSName}
          Environment=STREAM_CLIENTS=${KeepaliveClients}
          Environment=WORK_CLIENTS=${WorkClients}
          Environment=WORK_SLEEP_MS=${WorkSleepMs}
          ExecStart=/usr/bin/python3 /opt/loadgen.py
          Restart=always
          RestartSec=5

          [Install]
          WantedBy=multi-user.target
          SVC

          systemctl daemon-reload
          if [[ '${EnableBuiltInLoad}' == 'true' ]]; then
            systemctl enable --now loadgen.service
          else
            systemctl disable --now loadgen.service || true
          fi

Outputs:
  AlbUrl:
    Description: URL of the application load balancer.
    Value: !Sub http://${ApplicationLoadBalancer.DNSName}

  StreamUrl:
    Description: Long-lived SSE endpoint.
    Value: !Sub http://${ApplicationLoadBalancer.DNSName}/stream

  WorkUrl:
    Description: CPU-heavy work endpoint.
    Value: !Sub http://${ApplicationLoadBalancer.DNSName}/work

  LoadGeneratorInstanceId:
    Description: EC2 instance ID of the load generator.
    Value: !Ref LoadGeneratorInstance

  LoadGeneratorPublicIp:
    Description: Public IP of the load generator instance.
    Value: !GetAtt LoadGeneratorInstance.PublicIp

  SuggestedObservation:
    Description: What to observe during the demo.
    Value: >-
      Built-in load (EnableBuiltInLoad=true): watch SSE stickiness on /stream, per-instance CPU skew, and capacity oscillation
      from pinned connections. Request-spike mode (EnableBuiltInLoad=false): run make request-spike; / performs CPU work and
      the ASG should oscillate on average CPU between scale-out (50%) and scale-in (42%) thresholds.
