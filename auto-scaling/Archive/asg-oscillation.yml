---
Description: VPC/ALB/ASG/load-generator stack for repeatable Auto Scaling demonstrations. Supports CPU step scaling and optional ALB request-count target tracking. Includes optional oscillation-lab settings with tighter thresholds, shorter warmup/cooldown, and deterministic load generation hooks.

Parameters:
  AsgMinSize:
    Type: Number
    Default: 1
    MinValue: 1
    Description: Minimum number of EC2 instances in the Auto Scaling group.

  AsgMaxSize:
    Type: Number
    Default: 6
    MinValue: 1
    Description: Maximum number of EC2 instances in the Auto Scaling group.

  CpuScaleOutThreshold:
    Type: Number
    Default: 55
    MinValue: 1
    MaxValue: 100
    Description: Average ASG CPU percent above which the high CPU alarm fires.

  CpuScaleInThreshold:
    Type: Number
    Default: 45
    MinValue: 1
    MaxValue: 100
    Description: Average ASG CPU percent below which the low CPU alarm fires.

  CpuScalingPeriod:
    Type: Number
    Default: 60
    MinValue: 60
    MaxValue: 300
    Description: CloudWatch period in seconds for CPU alarms.

  CpuScaleOutEvaluationPeriods:
    Type: Number
    Default: 1
    MinValue: 1
    MaxValue: 10
    Description: Consecutive breaching periods before the scale-out alarm triggers.

  CpuScaleInEvaluationPeriods:
    Type: Number
    Default: 1
    MinValue: 1
    MaxValue: 10
    Description: Consecutive breaching periods before the scale-in alarm triggers.

  CpuStepScalingCooldown:
    Type: Number
    Default: 30
    MinValue: 0
    MaxValue: 600
    Description: Seconds between allowed scaling activities for CPU step scaling.

  HealthCheckGracePeriod:
    Type: Number
    Default: 60
    MinValue: 0
    Description: Grace period in seconds before ELB health checks affect new instances.

  DefaultInstanceWarmup:
    Type: Number
    Default: 60
    MinValue: 0
    Description: Default instance warmup in seconds for scaling metrics.

  EnableContinuousCpuNoise:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Enable a low-level background CPU load service on each ASG instance. Keep false for deterministic oscillation experiments.

  EnableAlbRequestScaling:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: Enable target tracking on ALBRequestCountPerTarget in addition to CPU step scaling.

  AlbRequestTargetValue:
    Type: Number
    Default: 75
    MinValue: 1
    Description: Target ALB requests per minute per target used by request-count target tracking.

  BaselineAlbTrafficEnabled:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: Start a low-rate baseline request loop on the load generator instance at boot.

Conditions:
  EnableContinuousCpuNoiseCondition: !Equals [!Ref EnableContinuousCpuNoise, 'true']
  EnableAlbRequestScalingCondition: !Equals [!Ref EnableAlbRequestScaling, 'true']
  BaselineAlbTrafficEnabledCondition: !Equals [!Ref BaselineAlbTrafficEnabled, 'true']

Resources:
  Role:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ec2.amazonaws.com
            Action:
              - sts:AssumeRole
      Path: /
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
        - arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy
      Tags:
        - Key: ResourceGroup
          Value: !Sub ${AWS::StackName}-rg

  Profile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Path: /
      Roles:
        - !Ref Role

  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-vpc
        - Key: ResourceGroup
          Value: !Sub ${AWS::StackName}-rg

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-igw
        - Key: ResourceGroup
          Value: !Sub ${AWS::StackName}-rg

  VpcGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: 10.0.0.0/24
      MapPublicIpOnLaunch: true
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-public-a
        - Key: ResourceGroup
          Value: !Sub ${AWS::StackName}-rg

  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone: !Select [1, !GetAZs '']
      CidrBlock: 10.0.1.0/24
      MapPublicIpOnLaunch: true
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-public-b
        - Key: ResourceGroup
          Value: !Sub ${AWS::StackName}-rg

  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: 10.0.10.0/24
      MapPublicIpOnLaunch: false
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-private-a
        - Key: ResourceGroup
          Value: !Sub ${AWS::StackName}-rg

  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone: !Select [1, !GetAZs '']
      CidrBlock: 10.0.11.0/24
      MapPublicIpOnLaunch: false
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-private-b
        - Key: ResourceGroup
          Value: !Sub ${AWS::StackName}-rg

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-public-rt
        - Key: ResourceGroup
          Value: !Sub ${AWS::StackName}-rg

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: VpcGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnetA

  PublicSubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnetB

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-private-rt
        - Key: ResourceGroup
          Value: !Sub ${AWS::StackName}-rg

  PrivateSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      SubnetId: !Ref PrivateSubnetA

  PrivateSubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      SubnetId: !Ref PrivateSubnetB

  LoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow HTTP traffic from the internet to the ALB
      VpcId: !Ref Vpc
      Tags:
        - Key: ResourceGroup
          Value: !Sub ${AWS::StackName}-rg
      SecurityGroupIngress:
        - CidrIp: 0.0.0.0/0
          IpProtocol: tcp
          FromPort: 80
          ToPort: 80
      SecurityGroupEgress:
        - CidrIp: 0.0.0.0/0
          IpProtocol: -1

  InstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow HTTP traffic from the ALB to Auto Scaling Group instances
      VpcId: !Ref Vpc
      Tags:
        - Key: ResourceGroup
          Value: !Sub ${AWS::StackName}-rg
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourceSecurityGroupId: !Ref LoadBalancerSecurityGroup
      SecurityGroupEgress:
        - CidrIp: 0.0.0.0/0
          IpProtocol: -1

  LoadGeneratorSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow outbound access from the load generator
      VpcId: !Ref Vpc
      Tags:
        - Key: ResourceGroup
          Value: !Sub ${AWS::StackName}-rg
      SecurityGroupEgress:
        - CidrIp: 0.0.0.0/0
          IpProtocol: -1

  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internet-facing
      Type: application
      SecurityGroups:
        - !Ref LoadBalancerSecurityGroup
      Subnets:
        - !Ref PublicSubnetA
        - !Ref PublicSubnetB
      Tags:
        - Key: asg-loadbalancer
          Value: 'true'
        - Key: role
          Value: loadbalancer
        - Key: ResourceGroup
          Value: !Sub ${AWS::StackName}-rg

  ApplicationTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      HealthCheckEnabled: true
      HealthCheckPath: /
      HealthCheckProtocol: HTTP
      Matcher:
        HttpCode: '200'
      Port: 80
      Protocol: HTTP
      TargetType: instance
      VpcId: !Ref Vpc
      Tags:
        - Key: ResourceGroup
          Value: !Sub ${AWS::StackName}-rg

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref ApplicationTargetGroup
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 80
      Protocol: HTTP

  LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      TagSpecifications:
        - ResourceType: launch-template
          Tags:
            - Key: ResourceGroup
              Value: !Sub ${AWS::StackName}-rg
      LaunchTemplateData:
        ImageId: resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-6.1-x86_64
        InstanceType: t3.small
        IamInstanceProfile:
          Name: !Ref Profile
        Monitoring:
          Enabled: true
        MetadataOptions:
          HttpTokens: required
        NetworkInterfaces:
          - AssociatePublicIpAddress: true
            DeviceIndex: 0
            Groups:
              - !Ref InstanceSecurityGroup
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - Key: Name
                Value: !Sub ${AWS::StackName}-asg-webserver
              - Key: asg-webserver
                Value: 'true'
              - Key: role
                Value: webserver
              - Key: ResourceGroup
                Value: !Sub ${AWS::StackName}-rg
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash -xe
            exec > >(tee /var/log/user-data.log | logger -t user-data) 2>&1

            dnf install -y stress-ng amazon-cloudwatch-agent python3

            mkdir -p /opt/aws/amazon-cloudwatch-agent/etc
            cat >/opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json <<'CWAGENT'
            {
              "metrics": {
                "metrics_collected": {
                  "cpu": {
                    "measurement": ["cpu_usage_idle", "cpu_usage_user", "cpu_usage_system"],
                    "metrics_collection_interval": 60,
                    "totalcpu": true
                  },
                  "mem": {
                    "measurement": ["mem_used_percent"],
                    "metrics_collection_interval": 60
                  }
                }
              }
            }
            CWAGENT
            systemctl enable amazon-cloudwatch-agent
            systemctl start amazon-cloudwatch-agent
            systemctl enable amazon-ssm-agent
            systemctl start amazon-ssm-agent

            cat >/usr/local/bin/cpu-load.sh <<'CPULOAD'
            #!/usr/bin/env bash
            set -euo pipefail
            while true; do
              LOAD=$(( (RANDOM % 20) + 25 ))
              DURATION=$(( (RANDOM % 60) + 60 ))
              stress-ng --cpu 1 --cpu-load "$LOAD" --cpu-method matrixprod --timeout "${!DURATION}s"
              sleep 5
            done
            CPULOAD
            chmod +x /usr/local/bin/cpu-load.sh

            cat >/etc/systemd/system/cpu-load.service <<'CPULOADSVC'
            [Unit]
            Description=Background CPU load simulator
            After=network.target

            [Service]
            ExecStart=/usr/local/bin/cpu-load.sh
            Restart=always
            RestartSec=5
            User=nobody

            [Install]
            WantedBy=multi-user.target
            CPULOADSVC

            if [[ '${EnableContinuousCpuNoise}' == 'true' ]]; then
              systemctl daemon-reload
              systemctl enable --now cpu-load.service
            else
              systemctl daemon-reload
              systemctl disable --now cpu-load.service || true
            fi

            appdir=/opt/web-application
            mkdir -p "$appdir"
            token=$(curl -sS -X PUT http://169.254.169.254/latest/api/token -H 'X-aws-ec2-metadata-token-ttl-seconds: 21600')
            instanceid=$(curl -sS -H "X-aws-ec2-metadata-token: $token" http://169.254.169.254/latest/meta-data/instance-id)
            availabilityzone=$(curl -sS -H "X-aws-ec2-metadata-token: $token" http://169.254.169.254/latest/meta-data/placement/availability-zone)

            cat >"$appdir/index.html" <<HTML
            <!doctype html>
            <html lang="en">
              <head>
                <meta charset="utf-8">
                <title>Scaling AWS Compute Demo</title>
                <style>
                  body { font-family: Arial, sans-serif; margin: 2rem; background: #f7f9fc; color: #1f2937; }
                  .card { max-width: 720px; background: #ffffff; padding: 2rem; border-radius: 12px; box-shadow: 0 12px 30px rgba(15, 23, 42, 0.08); }
                  code { background: #eef2ff; padding: 0.2rem 0.4rem; border-radius: 6px; }
                </style>
              </head>
              <body>
                <div class="card">
                  <h1>Scaling AWS Compute Demo</h1>
                  <p>This page is being served by an EC2 instance in an Auto Scaling Group behind an Application Load Balancer.</p>
                  <p><strong>Instance ID:</strong> <code>${!instanceid}</code></p>
                  <p><strong>Availability Zone:</strong> <code>${!availabilityzone}</code></p>
                  <p><strong>Stack:</strong> <code>${AWS::StackName}</code></p>
                </div>
              </body>
            </html>
            HTML

            cat >/usr/local/bin/web-application-server.py <<'PY'
            from http.server import HTTPServer, SimpleHTTPRequestHandler
            from socketserver import ThreadingMixIn
            import os

            class ThreadedHTTPServer(ThreadingMixIn, HTTPServer):
                daemon_threads = True

            os.chdir('/opt/web-application')
            ThreadedHTTPServer(('', 80), SimpleHTTPRequestHandler).serve_forever()
            PY
            chmod +x /usr/local/bin/web-application-server.py

            cat >/etc/systemd/system/web-application.service <<'SERVICE'
            [Unit]
            Description=Threaded HTTP server using Python3
            After=network-online.target
            Wants=network-online.target

            [Service]
            Type=simple
            WorkingDirectory=/opt/web-application
            ExecStart=/usr/bin/python3 /usr/local/bin/web-application-server.py
            Restart=always
            RestartSec=5

            [Install]
            WantedBy=multi-user.target
            SERVICE

            systemctl daemon-reload
            systemctl enable --now web-application.service

  AutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      MinSize: !Ref AsgMinSize
      MaxSize: !Ref AsgMaxSize
      HealthCheckGracePeriod: !Ref HealthCheckGracePeriod
      HealthCheckType: ELB
      DefaultInstanceWarmup: !Ref DefaultInstanceWarmup
      LaunchTemplate:
        LaunchTemplateId: !Ref LaunchTemplate
        Version: !GetAtt LaunchTemplate.LatestVersionNumber
      MetricsCollection:
        - Granularity: '1Minute'
      TargetGroupARNs:
        - !Ref ApplicationTargetGroup
      VPCZoneIdentifier:
        - !Ref PublicSubnetA
        - !Ref PublicSubnetB
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-asg-webserver
          PropagateAtLaunch: true
        - Key: asg-webserver
          Value: 'true'
          PropagateAtLaunch: true
        - Key: role
          Value: webserver
          PropagateAtLaunch: true
        - Key: ResourceGroup
          Value: !Sub ${AWS::StackName}-rg
          PropagateAtLaunch: true

  CpuStepScaleOutPolicy:
    Type: AWS::AutoScaling::ScalingPolicy
    Properties:
      AutoScalingGroupName: !Ref AutoScalingGroup
      PolicyType: StepScaling
      AdjustmentType: ChangeInCapacity
      Cooldown: !Ref CpuStepScalingCooldown
      MetricAggregationType: Average
      EstimatedInstanceWarmup: !Ref DefaultInstanceWarmup
      StepAdjustments:
        - MetricIntervalLowerBound: 0
          MetricIntervalUpperBound: 10
          ScalingAdjustment: 1
        - MetricIntervalLowerBound: 10
          ScalingAdjustment: 2

  CpuStepScaleInPolicy:
    Type: AWS::AutoScaling::ScalingPolicy
    Properties:
      AutoScalingGroupName: !Ref AutoScalingGroup
      PolicyType: StepScaling
      AdjustmentType: ChangeInCapacity
      Cooldown: !Ref CpuStepScalingCooldown
      MetricAggregationType: Average
      EstimatedInstanceWarmup: !Ref DefaultInstanceWarmup
      StepAdjustments:
        - MetricIntervalUpperBound: 0
          ScalingAdjustment: -1

  CpuHighAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Scale out when ASG average CPU exceeds threshold
      Namespace: AWS/EC2
      MetricName: CPUUtilization
      Statistic: Average
      Period: !Ref CpuScalingPeriod
      EvaluationPeriods: !Ref CpuScaleOutEvaluationPeriods
      Threshold: !Ref CpuScaleOutThreshold
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      Dimensions:
        - Name: AutoScalingGroupName
          Value: !Ref AutoScalingGroup
      AlarmActions:
        - !Ref CpuStepScaleOutPolicy

  CpuLowAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Scale in when ASG average CPU stays below threshold
      Namespace: AWS/EC2
      MetricName: CPUUtilization
      Statistic: Average
      Period: !Ref CpuScalingPeriod
      EvaluationPeriods: !Ref CpuScaleInEvaluationPeriods
      Threshold: !Ref CpuScaleInThreshold
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      Dimensions:
        - Name: AutoScalingGroupName
          Value: !Ref AutoScalingGroup
      AlarmActions:
        - !Ref CpuStepScaleInPolicy

  RequestTargetTrackingPolicy:
    Type: AWS::AutoScaling::ScalingPolicy
    Condition: EnableAlbRequestScalingCondition
    Properties:
      AutoScalingGroupName: !Ref AutoScalingGroup
      PolicyType: TargetTrackingScaling
      EstimatedInstanceWarmup: !Ref DefaultInstanceWarmup
      TargetTrackingConfiguration:
        DisableScaleIn: false
        TargetValue: !Ref AlbRequestTargetValue
        PredefinedMetricSpecification:
          PredefinedMetricType: ALBRequestCountPerTarget
          ResourceLabel: !Sub "${ApplicationLoadBalancer.LoadBalancerFullName}/${ApplicationTargetGroup.TargetGroupFullName}"

  LoadGeneratorInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-6.1-x86_64
      InstanceType: t3.small
      Monitoring: true
      IamInstanceProfile: !Ref Profile
      MetadataOptions:
        HttpTokens: required
      NetworkInterfaces:
        - AssociatePublicIpAddress: true
          DeviceIndex: 0
          GroupSet:
            - !Ref LoadGeneratorSecurityGroup
          SubnetId: !Ref PublicSubnetA
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-load-generator
        - Key: asg-load-generator
          Value: 'true'
        - Key: role
          Value: load-generator
        - Key: ResourceGroup
          Value: !Sub ${AWS::StackName}-rg
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash -xe
          exec > >(tee /var/log/user-data.log | logger -t user-data) 2>&1

          dnf install -y httpd-tools git docker java-21-amazon-corretto python3 python3-pip amazon-cloudwatch-agent
          systemctl enable amazon-cloudwatch-agent
          systemctl start amazon-cloudwatch-agent
          systemctl enable amazon-ssm-agent
          systemctl start amazon-ssm-agent

          cat >/usr/local/bin/generate-alb-requests.sh <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          URL="http://${ApplicationLoadBalancer.DNSName}/"
          while true; do
            curl -fsS -o /dev/null "$URL" || true
            sleep 2
          done
          SCRIPT
          chmod +x /usr/local/bin/generate-alb-requests.sh

          cat >/etc/systemd/system/ab-load.service <<'SERVICE'
          [Unit]
          Description=Low baseline ALB request generator
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          ExecStart=/usr/local/bin/generate-alb-requests.sh
          Restart=always
          RestartSec=5

          [Install]
          WantedBy=multi-user.target
          SERVICE

          systemctl daemon-reload
          if [[ '${BaselineAlbTrafficEnabled}' == 'true' ]]; then
            systemctl enable --now ab-load.service
          else
            systemctl disable --now ab-load.service || true
          fi

  StackResourceGroup:
    Type: AWS::ResourceGroups::Group
    Properties:
      Name: !Sub ${AWS::StackName}-rg
      Description: !Sub Resource group for CloudFormation stack ${AWS::StackName}
      ResourceQuery:
        Type: CLOUDFORMATION_STACK_1_0
        Query:
          StackIdentifier: !Ref AWS::StackId
          ResourceTypeFilters:
            - AWS::AllSupported
      Tags:
        - Key: ResourceGroup
          Value: !Sub ${AWS::StackName}-rg

Outputs:
  AlbURL:
    Description: Application Load Balancer URL
    Value: !Sub http://${ApplicationLoadBalancer.DNSName}

  AutoScalingGroupName:
    Description: Auto Scaling Group name
    Value: !Ref AutoScalingGroup

  LoadGeneratorInstanceId:
    Description: Instance ID of the load generator
    Value: !Ref LoadGeneratorInstance

  OscillationLabSuggestedOverrides:
    Description: Suggested parameters for a volatile oscillation demo
    Value: CpuScaleOutThreshold=55,CpuScaleInThreshold=45,CpuStepScalingCooldown=30,DefaultInstanceWarmup=60,HealthCheckGracePeriod=60,EnableContinuousCpuNoise=false,BaselineAlbTrafficEnabled=false,EnableAlbRequestScaling=true

  LoadGeneratorSsmCommand:
    Description: AWS CLI SSM command to connect to the LoadGeneratorInstance as root
    Value: !Sub aws ssm start-session --target ${LoadGeneratorInstance}
